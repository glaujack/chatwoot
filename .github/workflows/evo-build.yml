# Builds the fork's Docker image (linux/amd64, the server's architecture) and pushes it to ghcr.io.
# Production never follows a branch: it runs one fixed tag, and changes only when someone updates it by hand.
#   - git tag evo-4.19.1-1  ->  ghcr.io/<owner>/chatwoot:4.19.1-1
#   - run by hand (workflow_dispatch) or by evo-watch.yml for a candidate (tag candidate-<version>).
name: Build image

on:
  push:
    tags: ['evo-*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: evolution
      tag:
        description: Image tag (e.g. candidate-v4.20.0)
        required: true
      issue:
        description: Issue number to report the result on (optional)
        default: ''

permissions:
  contents: read
  packages: write
  issues: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chatwoot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Work out the tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME#evo-}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report on the issue
        if: ${{ always() && inputs.issue != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment "${{ inputs.issue }}" --repo "${{ github.repository }}" --body "✅ Imagem candidata pronta: \`${IMAGE}:${{ steps.meta.outputs.tag }}\`. A produção continua na versão anterior até você aprovar a troca."
          else
            gh issue comment "${{ inputs.issue }}" --repo "${{ github.repository }}" --body "❌ A compilação da imagem \`${{ steps.meta.outputs.tag }}\` falhou: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
